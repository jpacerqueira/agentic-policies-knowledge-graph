name: policy-kg

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: policy-kg-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/policy-graph-local
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - neo4j-data:/data
    networks:
      - policy-kg

  app:
    build: .
    image: policy-kg-app:local
    container_name: policy-kg-app
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: policy-graph-local
      PYTHONUNBUFFERED: "1"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./submittions:/app/submittions
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import pathlib,urllib.request; assert pathlib.Path('/tmp/pipeline.ok').is_file(); urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    networks:
      - policy-kg

networks:
  policy-kg:
    name: policy-kg-net
    driver: bridge

volumes:
  neo4j-data:
